<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Groq AI — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --surface: #13131a; --surface2: #1c1c27;
      --border: rgba(255,255,255,0.07); --accent: #7c6aff; --accent2: #ff6ac1;
      --text: #f0f0f8; --muted: #6b6b80; --radius: 20px;
    }
    body {
      background: var(--bg); font-family: 'DM Sans', sans-serif;
      min-height: 100vh; display: flex; align-items: center;
      justify-content: center; overflow: hidden; color: var(--text);
    }
    .bg-orbs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.12; animation: float 8s ease-in-out infinite; }
    .orb1 { width: 400px; height: 400px; background: #7c6aff; top: -100px; left: -100px; }
    .orb2 { width: 300px; height: 300px; background: #ff6ac1; bottom: -50px; right: -50px; animation-delay: 3s; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-20px)} }

    .card {
      position: relative; z-index: 1; width: 100%; max-width: 420px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 40px 36px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
      animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }

    .logo {
      width: 56px; height: 56px; background: linear-gradient(135deg, #7c6aff, #ff6ac1);
      border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 26px; margin: 0 auto 20px;
    }
    h1 { font-family: 'Syne', sans-serif; font-size: 24px; font-weight: 800; text-align: center; margin-bottom: 6px; }
    .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 28px; }

    .tabs { display: flex; background: var(--surface2); border-radius: 12px; padding: 4px; margin-bottom: 24px; }
    .tab {
      flex: 1; padding: 10px; text-align: center; border-radius: 9px;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
      color: var(--muted); border: none; background: none; font-family: 'DM Sans', sans-serif;
    }
    .tab.active { background: var(--accent); color: #fff; }

    .form { display: none; }
    .form.active { display: block; }

    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase; }
    input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 12px; padding: 13px 16px; color: var(--text);
      font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none;
      transition: border-color 0.2s; margin-bottom: 16px;
    }
    input:focus { border-color: rgba(124,106,255,0.5); box-shadow: 0 0 0 3px rgba(124,106,255,0.1); }
    input::placeholder { color: var(--muted); }

    .btn {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #7c6aff, #ff6ac1);
      border: none; border-radius: 12px; color: #fff; font-size: 15px;
      font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer;
      transition: opacity 0.2s, transform 0.15s; margin-top: 4px;
    }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .error {
      background: rgba(255,80,80,0.1); border: 1px solid rgba(255,80,80,0.3);
      color: #ff6b6b; border-radius: 10px; padding: 10px 14px;
      font-size: 13px; margin-bottom: 14px; display: none;
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="bg-orbs">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
  </div>

  <div class="card">
    <div class="logo">⚡</div>
    <h1>Groq AI Chatbot</h1>
    <p class="subtitle">Sign in to save your chat history</p>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div class="form active" id="loginForm">
      <div class="error" id="loginError"></div>
      <label>Username</label>
      <input type="text" id="loginUser" placeholder="Enter username"/>
      <label>Password</label>
      <input type="password" id="loginPass" placeholder="Enter password" onkeydown="if(event.key==='Enter') doLogin()"/>
      <button class="btn" onclick="doLogin()">Sign In</button>
    </div>

    <!-- Register Form -->
    <div class="form" id="registerForm">
      <div class="error" id="registerError"></div>
      <label>Username</label>
      <input type="text" id="regUser" placeholder="Choose a username"/>
      <label>Password</label>
      <input type="password" id="regPass" placeholder="Choose a password" onkeydown="if(event.key==='Enter') doRegister()"/>
      <button class="btn" onclick="doRegister()">Create Account</button>
    </div>
  </div>

  <script>
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tab + 'Form').classList.add('active');
    }

    async function doLogin() {
      const username = document.getElementById('loginUser').value.trim();
      const password = document.getElementById('loginPass').value.trim();
      const err = document.getElementById('loginError');
      if (!username || !password) { showError(err, 'Please fill in all fields'); return; }
      const res = await fetch('/login', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
      });
      const data = await res.json();
      if (data.success) { window.location.href = '/'; }
      else { showError(err, data.error); }
    }

    async function doRegister() {
      const username = document.getElementById('regUser').value.trim();
      const password = document.getElementById('regPass').value.trim();
      const err = document.getElementById('registerError');
      if (!username || !password) { showError(err, 'Please fill in all fields'); return; }
      if (password.length < 4) { showError(err, 'Password must be at least 4 characters'); return; }
      const res = await fetch('/register', {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, password})
      });
      const data = await res.json();
      if (data.success) { window.location.href = '/'; }
      else { showError(err, data.error); }
    }

    function showError(el, msg) {
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 3000);
    }
  </script>
</body>
</html>
